name: Build PrismRVL IPA

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      runner:
        description: "Runner label (macos-latest is Apple silicon, macos-15-intel is Intel)"
        required: false
        default: macos-latest

concurrency:
  group: prismrvl-ipa-${{ inputs.runner || 'macos-latest' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    timeout-minutes: 150

    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      HOMEBREW_NO_INSTALL_CLEANUP: "1"

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select newest Xcode
        run: |
          XCODE="$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)"
          if [ -n "$XCODE" ]; then
            echo "Using $XCODE"
            sudo xcode-select -s "$XCODE"
          else
            echo "No Xcode 26 found, using default"; ls /Applications | grep -i xcode || true
          fi
          xcodebuild -version
          # Keep compiling other files after an error so one run reports as many problems as possible.
          defaults write com.apple.dt.Xcode IDEBuildingContinueBuildingAfterErrors -bool YES

      - name: Install build tools
        run: brew install cmake ninja bartycrouch ccache

      - name: Restore compiler cache
        uses: actions/cache/restore@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-ios-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            ccache-ios-${{ runner.arch }}-

      - name: Configure compiler cache
        run: |
          ccache --set-config=max_size=3G
          ccache --zero-stats

      - name: Build PrismRVL (unsigned archive)
        run: |
          set -o pipefail
          rm -rf archives && mkdir archives
          xcodebuild archive \
            -project Source/iOS/App/DolphiniOS.xcodeproj \
            -scheme "DiOS (NJB)" \
            -configuration "Release (Non-Jailbroken)" \
            -archivePath "$GITHUB_WORKSPACE/archives/PrismRVL.xcarchive" \
            -derivedDataPath "$GITHUB_WORKSPACE/build-Xcode" \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -skipPackagePluginValidation -skipMacroValidation \
            DOL_PBID_ORGANIZATION_IDENTIFIER="dev.prismrvl" \
            DOL_BUILD_SOURCE="unofficial" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Save compiler cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-ios-${{ runner.arch }}-${{ github.sha }}-${{ github.run_attempt }}

      - name: Surface build errors
        if: failure()
        run: |
          python3 - <<'PY'
          import re, os
          lines = open(os.environ["GITHUB_WORKSPACE"] + "/build.log", errors="replace").read().splitlines()
          def esc(t):
              return t.replace("%", "%25").replace("\r", "").replace("\n", "%0A")
          errs = [l for l in lines if re.search(r"error:|fatal error|FAILED:|ninja: build stopped|ARCHIVE FAILED|CMake Error", l)]
          print("::error title=xcodebuild errors::" + esc("\n".join(errs[:30])[:6000]))
          print("::error title=build.log tail::" + esc("\n".join(lines[-35:])[:3500]))
          PY
          xcodebuild -version | head -2 | sed 's/^/::notice::/'
          HEADER="$(find "$GITHUB_WORKSPACE/build-Xcode" -name 'DolphiniOS-Swift.h' -path '*arm64*' 2>/dev/null | head -1)"
          if [ -n "$HEADER" ]; then
            echo "::notice title=Swift header::$(grep -c 'Prism' "$HEADER") Prism lines in $(basename "$HEADER")"
            echo "::notice title=Swift header classes::$(grep -o 'SWIFT_CLASS[_A-Z]*("[^"]*")' "$HEADER" | grep -i prism | tr '\n' ' ')"
          else
            echo "::notice title=Swift header::not generated"
          fi
          grep -E '\.swift:[0-9]+:[0-9]+: error:' build.log | head -15 | sed 's/^/::error title=swift::/' || true

      - name: Package IPA (ad-hoc signed, ready for SideStore/AltStore)
        run: |
          set -euo pipefail
          mkdir -p products
          APP="$GITHUB_WORKSPACE/archives/PrismRVL.xcarchive/Products/Applications/DolphiniOS.app"
          ls "$APP"
          Source/iOS/App/Project/Scripts/CreateIpa.sh \
            "$APP" "-" \
            "$GITHUB_WORKSPACE/Source/iOS/App/Project/Entitlements/Public.entitlements" \
            "$GITHUB_WORKSPACE/products/PrismRVL.ipa"
          ls -la products

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: PrismRVL-build-${{ github.run_number }}
          path: products/PrismRVL.ipa
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log-${{ github.run_number }}
          path: build.log
